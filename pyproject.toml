[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-voice-forwarder"
version = "0.1.0"
description = "Monitor Telegram groups for voice messages and forward them with a user account."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "python-dotenv>=1.0,<2",
  "Telethon>=1.44,<2",
]

[project.scripts]
telegram-voice-forwarder = "telegram_voice_forwarder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
